<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bah_ngupi | Espresso Dialer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #12100e;
            --card-bg: #1e1b18;
            --text-primary: #f5f0e6;
            --text-secondary: #a89f91;
            --accent: #d4a373;
            --accent-hover: #c68e57;
            --success: #6b9080;
            --danger: #e07a5f;
            --border: #2d2824;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-color); 
            color: var(--text-primary); 
            max-width: 480px; 
            margin: 0 auto; 
            padding: 24px 20px; 
            min-height: 100vh;
        }

        h1 { 
            text-align: center; 
            font-size: 1.5rem; 
            font-weight: 600;
            color: var(--accent); 
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        /* Timer Section */
        .timer-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .timer { 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 3.5rem; 
            color: var(--text-primary); 
            margin-bottom: 20px;
            font-variant-numeric: tabular-nums;
        }

        .timer-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn { 
            padding: 12px 20px; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 0.95rem; 
            font-weight: 600;
            transition: all 0.2s ease;
            flex: 1;
            max-width: 120px;
        }

        .btn:active { transform: scale(0.96); }
        .btn-start { background: var(--success); color: white; }
        .btn-start:hover { background: #5a7a6c; }
        .btn-stop { background: var(--danger); color: white; }
        .btn-stop:hover { background: #c96a52; }
        .btn-reset { background: var(--border); color: var(--text-secondary); }
        .btn-reset:hover { background: #3d3631; color: var(--text-primary); }

        /* Form Section */
        .form-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .input-row {
            display: flex;
            gap: 12px;
        }

        .input-group { 
            margin-bottom: 16px; 
            flex: 1;
        }

        label { 
            display: block; 
            margin-bottom: 6px; 
            font-size: 0.85rem; 
            font-weight: 500;
            color: var(--text-secondary); 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea { 
            width: 100%; 
            padding: 12px; 
            background: var(--bg-color); 
            border: 1px solid var(--border); 
            color: var(--text-primary); 
            border-radius: 8px; 
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea { resize: vertical; min-height: 60px; }

        .btn-save { 
            background: var(--accent); 
            color: #12100e; 
            width: 100%; 
            padding: 14px;
            font-size: 1rem;
            margin-top: 8px;
        }
        .btn-save:hover { background: var(--accent-hover); }

        /* History Section */
        .history { 
            border-top: 1px solid var(--border); 
            padding-top: 20px; 
        }
        
        .history h3 {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-weight: 500;
        }

        .shot-card { 
            background: var(--card-bg); 
            padding: 16px; 
            margin-bottom: 12px; 
            border-radius: 12px; 
            border-left: 4px solid var(--accent);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .shot-card .date {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .shot-card .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }

        .shot-card .notes {
            color: var(--text-secondary);
            font-style: italic;
            border-top: 1px solid var(--border);
            padding-top: 8px;
            margin-top: 8px;
        }
        
        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <h1>☕ Bah_ngupi</h1>

    <!-- Timer Section -->
    <div class="timer-container">
        <div id="timer" class="timer">00:00.0</div>
        <div class="timer-controls">
            <button class="btn btn-start" onclick="startTimer()">Start</button>
            <button class="btn btn-stop" onclick="stopTimer()">Stop</button>
            <button class="btn btn-reset" onclick="resetTimer()">Reset</button>
        </div>
    </div>

    <!-- Logger Section -->
    <div class="form-card">
        <div class="input-row">
            <div class="input-group">
                <label>Dose In (g)</label>
                <input type="number" id="dose" step="0.1" placeholder="18.0">
            </div>
            <div class="input-group">
                <label>Yield Out (g)</label>
                <input type="number" id="yield" step="0.1" placeholder="36.0">
            </div>
        </div>
        <div class="input-group">
            <label>Grind Size</label>
            <input type="text" id="grind" placeholder="e.g., 14 clicks, 5.5mm">
        </div>
        <div class="input-group">
            <label>Tasting Notes</label>
            <textarea id="notes" rows="2" placeholder="Sour, chocolatey, balanced..."></textarea>
        </div>
        <button class="btn btn-save" onclick="saveShot()">Save Recipe</button>
    </div>

    <!-- History Section -->
    <div class="history">
        <h3>Recent Shots</h3>
        <div id="history-list"></div>
    </div>

    <script>
        let startTime = 0;
        let elapsed = 0;
        let timerInterval = null;
        let finalTime = "00:00.0";

        function formatTime(ms) {
            let totalSec = Math.floor(ms / 1000);
            let min = Math.floor(totalSec / 60);
            let sec = totalSec % 60;
            let tenths = Math.floor((ms % 1000) / 100);
            return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}.${tenths}`;
        }

        function startTimer() {
            if (!timerInterval) {
                startTime = Date.now() - elapsed;
                timerInterval = setInterval(() => {
                    elapsed = Date.now() - startTime;
                    document.getElementById('timer').textContent = formatTime(elapsed);
                }, 50);
            }
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            finalTime = document.getElementById('timer').textContent;
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            elapsed = 0;
            finalTime = "00:00.0";
            document.getElementById('timer').textContent = finalTime;
        }

        function saveShot() {
            const shot = {
                date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                time: finalTime,
                dose: document.getElementById('dose').value || '-',
                yield: document.getElementById('yield').value || '-',
                grind: document.getElementById('grind').value || '-',
                notes: document.getElementById('notes').value
            };

            let history = JSON.parse(localStorage.getItem('espresso_history') || '[]');
            history.unshift(shot); 
            localStorage.setItem('espresso_history', JSON.stringify(history));
            
            renderHistory();
            ['dose', 'yield', 'grind', 'notes'].forEach(id => document.getElementById(id).value = '');
            resetTimer();
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('espresso_history') || '[]');
            const list = document.getElementById('history-list');
            
            if (history.length === 0) {
                list.innerHTML = '<div class="empty-state">No shots logged yet. Brew something!</div>';
                return;
            }

            list.innerHTML = history.map(s => `
                <div class="shot-card">
                    <div class="date">${s.date}</div>
                    <div class="stats">
                        <span>⏱️ ${s.time}</span>
                        <span>⚖️ ${s.dose}g → ${s.yield}g</span>
                    </div>
                    <div class="stats">
                        <span>⚙️ ${s.grind}</span>
                    </div>
                    ${s.notes ? `<div class="notes">"${s.notes}"</div>` : ''}
                </div>
            `).join('');
        }

        renderHistory();
    </script>
</body>
</html>
