<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espresso Dialer</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #1e1e1e; color: #f0f0f0; max-width: 400px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; color: #d4a373; }
        .timer { font-size: 3rem; text-align: center; font-family: monospace; margin: 20px 0; color: #faedcd; }
        .btn { padding: 10px 20px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; }
        .btn-start { background: #4caf50; color: white; }
        .btn-stop { background: #f44336; color: white; }
        .btn-reset { background: #555; color: white; }
        .btn-save { background: #d4a373; color: black; width: 100%; margin-top: 10px; }
        .input-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #ccc; }
        input, textarea { width: 100%; padding: 8px; background: #333; border: 1px solid #555; color: white; border-radius: 4px; box-sizing: border-box; }
        .history { margin-top: 30px; border-top: 1px solid #444; padding-top: 15px; }
        .shot-card { background: #2a2a2a; padding: 10px; margin-bottom: 10px; border-radius: 5px; font-size: 0.9rem; }
        .shot-card strong { color: #d4a373; }
    </style>
</head>
<body>

    <h1>☕ Espresso Dialer</h1>

    <!-- Timer Section -->
    <div id="timer" class="timer">00:00.0</div>
    <div style="text-align: center;">
        <button class="btn btn-start" onclick="startTimer()">Start</button>
        <button class="btn btn-stop" onclick="stopTimer()">Stop</button>
        <button class="btn btn-reset" onclick="resetTimer()">Reset</button>
    </div>

    <!-- Logger Section -->
    <div class="input-group">
        <label>Dose In (g)</label>
        <input type="number" id="dose" step="0.1" placeholder="18.0">
    </div>
    <div class="input-group">
        <label>Yield Out (g)</label>
        <input type="number" id="yield" step="0.1" placeholder="36.0">
    </div>
    <div class="input-group">
        <label>Grind Size</label>
        <input type="text" id="grind" placeholder="e.g., 14 clicks">
    </div>
    <div class="input-group">
        <label>Notes / Taste</label>
        <textarea id="notes" rows="2" placeholder="Sour? Bitter? Balanced?"></textarea>
    </div>
    <button class="btn btn-save" onclick="saveShot()">Save Recipe</button>

    <!-- History Section -->
    <div class="history">
        <h3>History</h3>
        <div id="history-list"></div>
    </div>

    <script>
        let startTime = 0;
        let elapsed = 0;
        let timerInterval = null;
        let finalTime = "00:00.0";

        function formatTime(ms) {
            let totalSec = Math.floor(ms / 1000);
            let min = Math.floor(totalSec / 60);
            let sec = totalSec % 60;
            let tenths = Math.floor((ms % 1000) / 100);
            return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}.${tenths}`;
        }

        function startTimer() {
            if (!timerInterval) {
                startTime = Date.now() - elapsed;
                timerInterval = setInterval(() => {
                    elapsed = Date.now() - startTime;
                    document.getElementById('timer').textContent = formatTime(elapsed);
                }, 50);
            }
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            finalTime = document.getElementById('timer').textContent;
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            elapsed = 0;
            finalTime = "00:00.0";
            document.getElementById('timer').textContent = finalTime;
        }

        function saveShot() {
            const shot = {
                date: new Date().toLocaleString(),
                time: finalTime,
                dose: document.getElementById('dose').value,
                yield: document.getElementById('yield').value,
                grind: document.getElementById('grind').value,
                notes: document.getElementById('notes').value
            };

            let history = JSON.parse(localStorage.getItem('espresso_history') || '[]');
            history.unshift(shot); // Add to top
            localStorage.setItem('espresso_history', JSON.stringify(history));
            
            renderHistory();
            // Clear inputs
            ['dose', 'yield', 'grind', 'notes'].forEach(id => document.getElementById(id).value = '');
            resetTimer();
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('espresso_history') || '[]');
            const list = document.getElementById('history-list');
            list.innerHTML = history.map(s => `
                <div class="shot-card">
                    <strong>${s.date}</strong><br>
                    Time: ${s.time} | Dose: ${s.dose}g -> Yield: ${s.yield}g<br>
                    Grind: ${s.grind}<br>
                    ${s.notes ? `Notes: ${s.notes}` : ''}
                </div>
            `).join('');
        }

        // Load history on start
        renderHistory();
    </script>
</body>
</html>
